services:
  web:
    build: .
    command: ["bash", "-c", "./wait-for-db.sh && python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && exec gunicorn loqt.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --keep-alive 5 --worker-class sync --log-level info --access-logfile - --error-logfile -"]
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env
    environment:
      # Support both DB_* and POSTGRES_* naming conventions in .env
      - DOCKER=true
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-${POSTGRES_DB:-loqt}}
      - DB_USER=${DB_USER:-${POSTGRES_USER:-loqt}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - DB_PORT=${DB_PORT:-5432}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_LOGLEVEL=${DJANGO_LOGLEVEL:-INFO}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      # Support both naming conventions from .env
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-loqt}}
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:-loqt}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USER:-loqt}} -d ${POSTGRES_DB:-${DB_NAME:-loqt}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "--log=stdout", "--authtoken=${NGROK_AUTH_TOKEN}", "web:8000"]
    ports:
      - "4040:4040"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
