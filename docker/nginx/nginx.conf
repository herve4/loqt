# Configuration du serveur en amont
upstream web {
    server web:8000;
}

# Configuration du serveur
server {
    listen 80;
    server_name _;  # Accepte tous les noms d'hôte
    
    # Taille maximale du corps de la requête
    client_max_body_size 20M;

    # Logging
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
    
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Configuration pour le Frontend React (construit)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Configuration pour l'API Backend Django
    location ~ ^/(api|admin|api-auth|health)/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        
        # En-têtes de base
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver la mise en cache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # Désactiver la mise en mémoire tampon
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # Configuration spécifique pour Django
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Désactiver la compression pour le débogage
        proxy_set_header Accept-Encoding "";
    }

    # Désactiver l'accès aux fichiers sensibles
    location ~ /\.(git|env) {
        deny all;
        return 404;
    }
}
