name: 🚀 Deploy to Production

on:
  push:
    branches:
      - master   # La branche de production (ajustez si différent)

  # Permet de déclencher manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

env:
  DEPLOY_DIR: ~/loqt
  COMPOSE_SERVICE: web   # Nom du service Django dans docker-compose.yml

jobs:
  # ── Job 1 : Build & Vérification ──────────────────────────────────────────
  verify:
    name: ✅ Verify & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build
        env:
          # Pointe vers l'API de production
          VITE_API_URL: https://sglci.sajholding.org/api/

  # ── Job 2 : Déploiement SSH ────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: verify   # Déployer uniquement si la vérification passe

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Timeout SSH étendu pour les builds Docker longs
          command_timeout: 30m
          script: |
            set -e   # Arrêter immédiatement si une commande échoue

            echo "═══════════════════════════════════════"
            echo "  🚀 LOQT — Déploiement Production"
            echo "  📅 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════"

            cd ${{ env.DEPLOY_DIR }}

            # ── 1. Récupérer le dernier code ───────────────────────────────
            echo ""
            echo "📥 [1/6] Pull du code source..."
            git fetch --all
            git reset --hard origin/master
            echo "✅ Code mis à jour : $(git log -1 --format='%h %s')"

            # Nettoyage unique : supprime l'ancien dossier staticfiles (bind mount → volume nommé)
            # Les fichiers statiques sont maintenant dans un volume Docker géré (static_volume)
            if [ -d "./staticfiles" ]; then
              sudo rm -rf ./staticfiles 2>/dev/null || rm -rf ./staticfiles 2>/dev/null || true
              echo "🧹 Ancien dossier staticfiles (bind mount) supprimé"
            fi


            # ── 2. S'assurer que la DB tourne (sans la recréer) ────────────
            echo ""
            echo "🗄️  [2/6] Vérification de la base de données..."
            DB_STATUS=$(docker compose ps -q db 2>/dev/null)
            if [ -z "$DB_STATUS" ]; then
              echo "   DB non démarrée, lancement..."
              docker compose up -d db
            else
              DB_STATE=$(docker inspect --format='{{.State.Status}}' loqt-db-1 2>/dev/null || echo "unknown")
              echo "   DB état : $DB_STATE"
            fi

            # Attendre que la DB soit healthy avant de continuer
            echo "   Attente que PostgreSQL soit prêt..."
            DB_RETRIES=20
            DB_COUNT=0
            until docker compose exec -T db pg_isready -q 2>/dev/null; do
              DB_COUNT=$((DB_COUNT + 1))
              if [ "$DB_COUNT" -ge "$DB_RETRIES" ]; then
                echo "❌ PostgreSQL n'est pas prêt après $((DB_RETRIES * 5))s."
                echo "── Logs DB ──"
                docker compose logs --tail=30 db
                exit 1
              fi
              echo "   ... DB tentative $DB_COUNT/$DB_RETRIES (5s)"
              sleep 5
            done
            echo "✅ PostgreSQL opérationnel"

            # ── 3. Arrêter uniquement les services applicatifs ─────────────
            echo ""
            echo "⏹  [3/6] Arrêt des services applicatifs (DB intacte)..."
            docker compose stop web nginx ngrok 2>/dev/null || true
            docker compose rm -f web nginx ngrok 2>/dev/null || true
            echo "✅ Services applicatifs arrêtés"

            # ── 4. Reconstruire les images ────────────────────────────────
            echo ""
            echo "🔨 [4/6] Build des images Docker (web, nginx)..."
            docker compose build --no-cache web nginx
            echo "✅ Images construites"

            # ── 5. Relancer uniquement les services applicatifs ───────────
            echo ""
            echo "▶️  [5/6] Démarrage des services applicatifs..."
            docker compose up -d web nginx ngrok
            echo "✅ Services démarrés"

            # ── 6. Attendre que le service web soit prêt ──────────────────
            echo ""
            echo "⏳ [6/6] Attente du démarrage du service web..."
            sleep 15

            MAX_RETRIES=12
            COUNT=0
            until docker compose exec -T web curl -sf http://localhost:8000/health/ > /dev/null 2>&1; do
              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                echo "❌ Le service web n'a pas démarré après $((MAX_RETRIES * 5))s."
                echo "── Logs web ──"
                docker compose logs --tail=60 web
                exit 1
              fi
              echo "   ... tentative $COUNT/$MAX_RETRIES (5s)"
              sleep 5
            done

            echo "✅ Service web opérationnel !"

            # ── 7. Import des données initiales (Régions, Villes, Églises) ──
            echo ""
            echo "📥 [7/7] Importation des régions et des églises..."
            docker compose exec -T web python scripts/import_eglises.py
            docker compose exec -T web python scripts/populate_production.py
            echo "✅ Importation terminée"

            # ── Nettoyage Docker (images vieilles) ───────────────────────
            docker image prune -f --filter "until=48h" > /dev/null 2>&1 || true

            echo ""
            echo "═══════════════════════════════════════"
            echo "  ✅ Déploiement réussi !"
            echo "  🌐 https://sglci.sajholding.org/"
            echo "  📦 Commit : $(git log -1 --format='%h — %s')"
            echo "═══════════════════════════════════════"

  # ── Job 3 : Notification de résultat ──────────────────────────────────────
  notify:
    name: 📢 Notify Result
    runs-on: ubuntu-latest
    needs: [verify, deploy]
    if: always()   # Toujours exécuter, même en cas d'échec

    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "🎉 Déploiement RÉUSSI sur https://sglci.sajholding.org/"
            echo "Branch: master | Commit: ${{ github.sha }}"
          else
            echo "❌ Déploiement ÉCHOUÉ"
            echo "Vérifiez l'onglet Actions pour les détails."
          fi
