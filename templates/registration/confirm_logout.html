{% extends 'base/base.html' %}
{% block content %}
  <div class="card">
    <h2>Déconnexion</h2>
    <p>Êtes-vous sûr de vouloir vous déconnecter ?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn-confirm">Oui, se déconnecter</button>
      <a href="#" onclick="history.back()" class="btn-cancel">Non, retourner</a>
    </form>
  </div>
{% endblock %}
