{% extends "base/base.html" %}
{% block content %}
<div>
    <button onclick="history.back()" class="btn-retour"><i class="fas fa-arrow-left"></i> Retour</button>
</div>
<h2>Événements / Camps</h2>
<a href="{% url 'camp-create' %}" class="btn">Nouveau camp</a>
<table>
  <thead>
    <tr><th>Nom</th><th>Ville</th><th>Date</th><th>Région</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for camp in object_list %}
    <tr>
      <td>{{ camp.nom }}</td>
      <td>{{ camp.ville }}</td>
      <td>{{ camp.date }}</td>
      <td>{{ camp.region.nom }}</td>
      <td>
        <a href="{% url 'camp-detail' camp.id %}">Voir</a> |
        <a href="{% url 'camp-update' camp.id %}">Modifier</a> |
        <a href="{% url 'camp-delete' camp.id %}">Supprimer</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
