
{% block content %}

<div id="deleteModal" class="modal-overlay">
  <div class="modal-box">
    <h2 class="modal-title">Confirmer la suppression</h2>
    <p id="deleteMessage" class="modal-text">
      Êtes-vous sûr de vouloir supprimer ce matériel ?
    </p>
    <div class="modal-actions">
      <button id="confirmDeleteBtn" class="btn-danger">Oui, Supprimer</button>
      <button id="cancelDeleteBtn" class="btn-secondary">Annuler</button>
    </div>
  </div>
</div>


{% endblock %}
