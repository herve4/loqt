
<!-- Modal de modification de région -->
<div class="region-modal fade" id="editRegionModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="region-modal-dialog" role="document">
        <div class="region-modal-content">
            <div class="region-modal-header">
                <h5 class="region-modal-title">
                    <i class="fas fa-edit"></i>
                    <span>Modifier la région</span>
                </h5>
                <button type="button" class="region-close-btn close" id="closeModalBtn" aria-label="Fermer">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="region-modal-body" id="editRegionModalBody">
                <div class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Chargement du formulaire...</p>
                </div>
            </div>
            
            <div class="region-modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelModalBtn">
                    <i class="fas fa-times"></i>
                    <span>Annuler</span>
                </button>
                <button type="submit" class="btn btn-primary" id="saveRegionBtn" form="regionForm" disabled>
                    <i class="fas fa-save"></i>
                    <span>Enregistrer les modifications</span>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="region-modal-backdrop fade" id="modalBackdrop" style="display: none;"></div>
