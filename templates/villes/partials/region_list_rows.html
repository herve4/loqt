{% for region in regions %}
<tr data-region-id="{{ region.id }}">
    <td class="align-middle">{{ region.nom }}</td>
    <td class="text-end">
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" 
                    id="dropdownMenuButton{{ region.id }}" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false"
                    onclick="event.stopPropagation();">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" 
                aria-labelledby="dropdownMenuButton{{ region.id }}">
                <li>
                    <a class="dropdown-item" href="#" 
                       onclick="loadRegionForm('{% url 'region-update' region.id %}')">
                        <i class="fas fa-edit me-2"></i>Modifier
                    </a>
                </li>
                <li>
                    <a class="dropdown-item text-danger" href="#" 
                       onclick="deleteRegion('{% url 'region-delete' region.id %}', '{{ region.nom|escapejs }}', this); return false;">
                        <i class="fas fa-trash-alt me-2"></i>Supprimer
                    </a>
                </li>
            </ul>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="2" class="text-center">
        {% if is_search %}
            Aucune région ne correspond à votre recherche
        {% else %}
            Aucune région enregistrée
        {% endif %}
    </td>
</tr>
{% endfor %}
