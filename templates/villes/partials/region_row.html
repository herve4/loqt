<tr data-region-id="{{ region.id }}" class="fade-in border-top">
    <td class="py-3 table-cell-responsive">
        <div class="region-name-container">
            <div class="region-icon">
                <i class="fas fa-map-marker-alt text-primary"></i>
            </div>
            <div class="region-name-text">
                <h6 class="mb-0 fw-semibold text-truncate" title="{{ region.nom }}">
                    {{ region.nom }}
                </h6>
            </div>
        </div>
    </td>
    <td class="py-3">
        <div class="d-flex flex-column">
            <span class="fw-medium">{{ region.created_at|date:"d/m/Y" }}</span>
            <small class="text-muted">{{ region.created_at|date:"H:i" }}</small>
        </div>
    </td>
    <td class="text-end pe-3 py-3">
        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-sm btn-soft-info btn-icon"
                    title="Détails - Bientôt disponible"
                    data-bs-toggle="tooltip">
                <i class="fas fa-info-circle"></i>
            </button>
            <a href="{% url 'region-update' region.id %}" 
               class="btn btn-sm btn-outline-primary btn-action"
               title="Modifier la région {{ region.nom }}"
               data-bs-toggle="tooltip"
               data-bs-placement="top"
               aria-label="Modifier la région {{ region.nom }}">
                <i class="fas fa-edit"></i>
                <span class="d-none d-md-inline ms-1">Modifier</span>
            </a>
            <button class="btn btn-sm btn-soft-danger btn-icon"
                    title="Supprimer - Bientôt disponible"
                    data-bs-toggle="tooltip">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </td>
</tr>
