<tr>
    {% if region and region.pk %}
    <td>{{ region.nom }}</td>
    <td class="text-end">
        {% with region_id=region.pk|default:0 %}
        <button class="btn btn-sm btn-primary"
                {% if region_id %}
                hx-get="{% url 'region-update' region_id %}"
                hx-target="#modal-content"
                hx-trigger="click"
                hx-swap="innerHTML"
                data-bs-toggle="modal"
                data-bs-target="#region-modal"
                hx-on::before-request="this.disabled=true; this.innerHTML='<i class=\'fas fa-spinner fa-spin\'></i>'"
                hx-on::after-request="this.disabled=false; this.innerHTML='<i class=\'fas fa-edit\'></i>'"
                onclick="document.getElementById('region-modal').style.display='block'; return false;"
                {% else %}
                disabled
                title="ID de région manquant"
                {% endif %}>
            <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-sm btn-danger ms-1"
                {% if region_id %}
                hx-get="{% url 'region-delete' region_id %}"
                hx-target="#modal-content"
                hx-trigger="click"
                hx-swap="innerHTML"
                data-bs-toggle="modal"
                data-bs-target="#region-modal"
                hx-on::before-request="this.disabled=true; this.innerHTML='<i class=\'fas fa-spinner fa-spin\'></i>'"
                hx-on::after-request="this.disabled=false; this.innerHTML='<i class=\'fas fa-trash\'></i>'"
                onclick="document.getElementById('region-modal').style.display='block'; return false;"
                {% else %}
                disabled
                title="ID de région manquant"
                {% endif %}>
            <i class="fas fa-trash"></i>
        </button>
        {% endwith %}
    </td>
    {% else %}
    <td colspan="2" class="text-danger">
        <i class="fas fa-exclamation-triangle"></i> Erreur: Données de région invalides
        {% if debug %}
        <div class="small text-muted">
            Region: {{ region|default:"Non défini" }}
            {% if region %}
            <br>ID: {{ region.id|default:"Non défini" }}
            {% endif %}
        </div>
        {% endif %}
    </td>
    {% endif %}
</tr>

<script>
// Gestion des erreurs HTMX
document.body.addEventListener('htmx:responseError', function(evt) {
    if (evt.detail.requestConfig.elt.matches('[hx-get*="region-"]')) {
        console.error('Erreur lors de la requête:', evt.detail);
        showToast('Une erreur est survenue. Veuillez réessayer.', 'error');
    }
});
</script>
