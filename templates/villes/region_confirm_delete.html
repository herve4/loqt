{% load i18n %}
<div class="delete-confirmation">
    <h3>Confirmer la suppression</h3>
    <p>Êtes-vous sûr de vouloir supprimer la région <strong>{{ region.nom }}</strong> ?</p>
    <p class="text-danger">Attention : Cette action est irréversible.</p>
    
    <div class="form-actions">
        <form method="POST" action="{% url 'region-delete' region.pk %}">
            {% csrf_token %}
            <button type="button" class="btn btn-secondary" 
                    onclick="this.closest('.modal-content').style.display='none'">
                Annuler
            </button>
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash"></i> Supprimer définitivement
            </button>
        </form>
    </div>
</div>

<style>
.delete-confirmation {
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
    background: white;
    border-radius: 5px;
}

.delete-confirmation h3 {
    margin-top: 0;
    color: #dc3545;
}

.text-danger {
    color: #dc3545;
    font-weight: bold;
}

.form-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.btn-secondary {
    background-color: #6c757d;
    color: white;
}

.btn-danger {
    background-color: #dc3545;
    color: white;
}

.btn-danger:hover {
    background-color: #c82333;
}

.btn i {
    font-size: 12px;
}
</style>
