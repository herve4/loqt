{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}?v={{ STATIC_VERSION }}">
  <link rel="stylesheet" href="{% static 'css/msg.css' %}?v={{ STATIC_VERSION }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-container">
    <!-- Slideshow des événements -->
    <div class="events-slideshow">

      {% include "sliders_auth.html" %}
    </div>
    
    <!-- Formulaire de connexion -->
    <div class="login-container">
      <audio id="notifSound" src="{% static 'notify/notif2.mp3' %}" preload="auto"></audio>
      <div class="login-form">
        <div class="logo">
          <img src="{% static 'img/logo.jpg' %}" alt="Logo">
        </div>
        <h2>Connexion</h2>
        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}
        {% if messages %}
          <div class="messages">
            {% for message in messages %}
              <div class="message {{ message.tags }}">
                <i class="fas 
                {% if message.tags == 'success' %}fa-circle-check{% endif %}
                {% if message.tags == 'info' %}fa-circle-info{% endif %}
                {% if message.tags == 'error' %}fa-circle-xmark{% endif %}
                {% if message.tags == 'warning' %}fa-triangle-exclamation{% endif %}
              "></i>
                {{ message }}
                <span class="close-btn" onclick="this.parentElement.remove()">x</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}
        
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" name="user" placeholder="Email ou téléphone" value="{{phone|default:''}}" required>
          </div>
          
          <div class="form-group">
            <i class="fas fa-lock input-icon"></i>
            <div class="password-field">
              <input type="password" name="password" id="password" placeholder="Mot de passe" required>
              <span class="toggle-password" id="togglePassword">
                <i class="fa fa-eye"></i>
              </span>
            </div>
          </div>
          
          <div class="form-extra">
            <label class="remember-me">
              <input type="checkbox" name="remember_me">
              <span class="checkmark"></span>
              Se souvenir de moi
            </label>
            <a href="#" class="forgot-password">Mot de passe oublié ?</a>
          </div>
          
          <button type="submit" id="submitBtn" class="btn-login">
            <span class="btn-text">Se connecter</span>
            <span class="loader" id="loader" style="display:none;"></span>
          </button>
          
          <div class="social-login">
            <p>Suivez-nous sur</p>
            <div class="social-icons">
              <a href="https://iyf.ci/" class="social-icon google"><i class="fa-solid fa-globe"></i></a>
              <a href="https://www.facebook.com/iyfci" class="social-icon facebook"><i class="fa-brands fa-facebook"></i></a>
              <a href="#" class="social-icon twitter"><i class="fa-brands fa-youtube"></i></a>
            </div>
          </div>
          
          <p class="register-link">Pas encore de compte ? <a href="{% url 'signup' %}">S'inscrire</a></p>
        </form>
      </div>
    </div>
  </div>
  
  <script src="{% static 'js/login.js' %}?v={{ STATIC_VERSION }}"></script>
  <script src="{% static 'js/msg.js' %}?v={{ STATIC_VERSION }}"></script>
  <script src="{% static 'js/slideshow.js' %}?v={{ STATIC_VERSION }}"></script>
  <script src="{% static 'js/3d-animation.js' %}?v={{ STATIC_VERSION }}"></script>
</body>
</html>
