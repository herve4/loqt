<div class="modal fade" id="materielModal" tabindex="-1" role="dialog" aria-labelledby="materielModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="materielModalLabel">Ajouter du Matériel</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addMaterielForm" action="{% url 'events:add_materiel' event.pk %}" method="post">
                    {% csrf_token %}
                    {{ materiel_form.as_p }}
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                <button type="submit" form="addMaterielForm" class="btn btn-primary">Ajouter</button>
            </div>
        </div>
    </div>
</div>
