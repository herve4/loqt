<div class="modal fade" id="chronoModal" tabindex="-1" role="dialog" aria-labelledby="chronoModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="chronoModalLabel">Ajouter une Activité au Chronogramme</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addChronoForm" action="{% url 'events:add_chronogramme_item' event.pk %}" method="post">
                    {% csrf_token %}
                    {{ chronogramme_form.as_p }}
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                <button type="submit" form="addChronoForm" class="btn btn-primary">Ajouter</button>
            </div>
        </div>
    </div>
</div>
