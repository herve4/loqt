<ul class="list-group list-group-flush">
    {% for item in event.chronogramme_items.all %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong>{{ item.heure|time:"H:i" }}</strong> - {{ item.activite }}
                <small class="d-block text-muted">Durée: {{ item.duree }} min | Intervenant: {{ item.intervenant|default:'N/A' }}</small>
            </div>
            <div>
                <a href="#" class="btn btn-sm btn-warning edit-chrono-btn" data-url="{% url 'events:update_chronogramme_item' item.pk %}">Modifier</a>
                <a href="#" class="btn btn-sm btn-danger delete-item-btn" data-url="{% url 'events:delete_chronogramme_item' item.pk %}">Supprimer</a>
            </div>
        </li>
    {% empty %}
        <li class="list-group-item">Aucune activité programmée pour le moment.</li>
    {% endfor %}
</ul>
