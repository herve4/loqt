<ul class="list-group list-group-flush">
    {% for item in event.evenementmateriel_set.all %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ item.materiel.nom }} (Quantité: {{ item.quantite }})
            <div>
                <a href="#" class="btn btn-sm btn-warning edit-materiel-btn" data-url="{% url 'events:update_materiel' item.pk %}">Modifier</a>
                <a href="#" class="btn btn-sm btn-danger delete-item-btn" data-url="{% url 'events:remove_materiel' item.pk %}">Supprimer</a>
            </div>
        </li>
    {% empty %}
        <li class="list-group-item">Aucun matériel associé pour le moment.</li>
    {% endfor %}
</ul>
